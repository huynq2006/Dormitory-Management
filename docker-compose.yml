services:
  # Master Database Server
  mysql-master:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.master
    container_name: mysql-master
    restart: always
    ports:
      - "13306:3306"
    env_file:
      - .env
    networks:
      - internal_db_net
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - ./database/migrations:/migrations
      - master-data:/var/lib/mysql

  # Slave Database Server
  mysql-slave:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.slave
    container_name: mysql-slave
    restart: always
    ports:
      - "13307:3306"
    env_file:
      - .env
    depends_on:
      - mysql-master
    networks:
      - internal_db_net
    volumes:
      - slave-data:/var/lib/mysql

  # Streamlit Dashboard
  streamlit:
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    container_name: streamlit-app
    restart: unless-stopped
    ports:
      - "18501:8501"
    depends_on:
      - mysql-master
      - mysql-slave
    env_file:
      - .env
    environment:
      - DB_MASTER_URL=mysql+pymysql://app_user:App_Pass@123@mysql-master:3306/dormitory_management
      - DB_SLAVE_URL=mysql+pymysql://app_user:App_Pass@123@mysql-slave:3306/dormitory_management
    networks:
      - internal_db_net
    volumes:
      - ./dashboard:/app/dashboard
      - ./backend:/app/backend
      - ./scripts:/app/scripts
volumes:
  master-data:
  slave-data:

networks:
  internal_db_net:
    driver: bridge
