services:
  # Master Database Server
  mysql-master:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.master
    container_name: mysql-master
    restart: always
    ports:
      - "13306:3306"
    env_file:
      - .env
    networks:
      - internal_db_net
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - ./database/migrations:/migrations
      - master-data:/var/lib/mysql

  # Slave Database Server
  mysql-slave:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.slave
    container_name: mysql-slave
    restart: always
    ports:
      - "13307:3306"
    env_file:
      - .env
    depends_on:
      - mysql-master
    networks:
      - internal_db_net
    volumes:
      - slave-data:/var/lib/mysql
  backend:
    build: ./backend
    container_name: python-backend
    depends_on:
      - mysql-master
      - mysql-slave
    env_file:
      - .env
    networks:
      - internal_db_net
    volumes:
      - ./backend:/app
volumes:
  master-data:
  slave-data:

networks:
  internal_db_net:
    driver: bridge
