version: '3.8'

services:
  # Master Database Server
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    ports:
      - "33060:3306"
    env_file:
      - .env
    volumes:
      - ./mysql-config/master.cnf:/etc/mysql/conf.d/master.cnf
      - ./database:/docker-entrypoint-initdb.d
      - ./database/migrations:/migrations
      - master-data:/var/lib/mysql
    command: >
      sh -c "chmod 644 /etc/mysql/conf.d/master.cnf && exec mysqld"

  # Slave Database Server
  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: always
    ports:
      - "33061:3306"
    env_file:
      - .env
    depends_on:
      - mysql-master
    volumes:
      - ./mysql-config/slave.cnf:/etc/mysql/conf.d/slave.cnf
      - slave-data:/var/lib/mysql
    command: >
      sh -c "chmod 644 /etc/mysql/conf.d/slave.cnf && exec mysqld"
volumes:
  master-data:
  slave-data: